<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SIP Manufacturing | P2P Navigator</title>

  <style>
    :root {
      --primary: #2563eb;
      --background: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Inter, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--background);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .flow-container {
      overflow-x: auto;
      padding: 24px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .flow {
      display: flex;
      align-items: center;
      width: max-content;
      min-width: 100%;
    }

    .process {
      width: 175px;
      min-height: 105px;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: white;
      cursor: pointer;
      text-align: left;
      transition: 0.2s ease;
      font: inherit;
      color: inherit;
    }

    .process:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(37,99,235,.12);
    }

    .process.active {
      background: #eff6ff;
      border-color: var(--primary);
    }

    .process-number {
      font-size: 11px;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .process-title {
      font-size: 14px;
      font-weight: 650;
      line-height: 1.4;
    }

    .process-dept {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    .arrow {
      width: 40px;
      height: 2px;
      background: #94a3b8;
      position: relative;
      flex-shrink: 0;
    }

    .arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: -5px;
      border-left: 8px solid #94a3b8;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }

    .details {
      margin-top: 20px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: white;
    }

    .details h2 {
      font-size: 19px;
      margin: 0 0 12px;
    }

    .details p {
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
    }

    .metadata {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .tag {
      background: #f1f5f9;
      padding: 7px 11px;
      border-radius: 7px;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .header h1 {
        font-size: 18px;
      }

      .process {
        width: 155px;
      }

      .details {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>SIP Components Manufacturing</h1>
      <p>
        Procure to Pay (P2P) |
        Interactive Process Navigator
      </p>
    </header>

    <section class="flow-container"
             aria-label="P2P process flow">
      <div class="flow" id="processFlow"></div>
    </section>

    <section class="details" id="details"
             aria-live="polite"></section>

  </main>

  <script>
    /*
      Replace notionUrl with the actual
      Notion page URL for each process.
    */

    const processes = [
      {
        id: "requirement",
        title: "Material Requirement",
        department: "Production Planning",
        tcode: "MD04",
        description:
          "Identify raw material requirements " +
          "based on production demand and stock.",
        notionUrl: ""
      },
      {
        id: "requisition",
        title: "Purchase Requisition",
        department: "Procurement",
        tcode: "ME51N",
        description:
          "Create an internal request to procure " +
          "materials or services.",
        notionUrl: ""
      },
      {
        id: "quotation",
        title: "RFQ & Quotation Comparison",
        department: "Purchasing",
        tcode: "ME41 / ME49",
        description:
          "Request supplier quotations and " +
          "compare commercial offers.",
        notionUrl: ""
      },
      {
        id: "purchase-order",
        title: "Purchase Order",
        department: "Purchasing",
        tcode: "ME21N",
        description:
          "Create the formal purchase order " +
          "for the selected supplier.",
        notionUrl: ""
      },
      {
        id: "goods-receipt",
        title: "Goods Receipt",
        department: "Stores",
        tcode: "MIGO",
        description:
          "Record receipt of materials against " +
          "the purchase order.",
        notionUrl: ""
      },
      {
        id: "quality",
        title: "Quality Inspection",
        department: "Quality",
        tcode: "QA32",
        description:
          "Inspect received materials and " +
          "record quality decisions.",
        notionUrl: ""
      },
      {
        id: "invoice",
        title: "Invoice Verification",
        department: "Finance",
        tcode: "MIRO",
        description:
          "Verify the supplier invoice against " +
          "the purchase order and goods receipt.",
        notionUrl: ""
      },
      {
        id: "payment",
        title: "Vendor Payment",
        department: "Finance",
        tcode: "F110",
        description:
          "Process payment of approved " +
          "supplier invoices.",
        notionUrl: ""
      }
    ];

    let activeIndex = 0;

    const flowElement =
      document.getElementById("processFlow");

    const detailsElement =
      document.getElementById("details");

    function renderFlow() {
      flowElement.innerHTML = "";

      processes.forEach((process, index) => {

        if (index > 0) {
          const arrow =
            document.createElement("div");
          arrow.className = "arrow";
          arrow.setAttribute(
            "aria-hidden", "true"
          );
          flowElement.appendChild(arrow);
        }

        const button =
          document.createElement("button");

        button.className =
          "process" +
          (index === activeIndex ? " active" : "");

        button.type = "button";
        button.setAttribute(
          "aria-pressed",
          String(index === activeIndex)
        );

        const number =
          document.createElement("div");
        number.className = "process-number";
        number.textContent =
          "STEP " + String(index + 1).padStart(2, "0");

        const title =
          document.createElement("div");
        title.className = "process-title";
        title.textContent = process.title;

        const dept =
          document.createElement("div");
        dept.className = "process-dept";
        dept.textContent = process.department;

        button.append(number, title, dept);

        button.addEventListener("click", () => {
          selectProcess(index);
        });

        flowElement.appendChild(button);
      });
    }

    function selectProcess(index) {
      activeIndex = index;
      renderFlow();
      renderDetails();
    }

    function renderDetails() {
      const process = processes[activeIndex];

      detailsElement.innerHTML = "";

      const heading = document.createElement("h2");
      heading.textContent = process.title;

      const description = document.createElement("p");
      description.textContent = process.description;

      const metadata = document.createElement("div");
      metadata.className = "metadata";

      const department = document.createElement("span");
      department.className = "tag";
      department.textContent =
        "Department: " + process.department;

      const transaction = document.createElement("span");
      transaction.className = "tag";
      transaction.textContent =
        "SAP: " + process.tcode;

      metadata.append(department, transaction);

      const actions = document.createElement("div");
      actions.className = "actions";

      const previous = document.createElement("button");
      previous.className = "btn";
      previous.textContent = "← Previous";
      previous.disabled = activeIndex === 0;
      previous.addEventListener("click", () => {
        selectProcess(activeIndex - 1);
      });

      const next = document.createElement("button");
      next.className = "btn";
      next.textContent = "Next →";
      next.disabled = activeIndex === processes.length - 1;
      next.addEventListener("click", () => {
        selectProcess(activeIndex + 1);
      });

      actions.appendChild(previous);

      if (process.notionUrl) {
        const link = document.createElement("a");
        link.className = "btn btn-primary";
        link.href = process.notionUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open Notion Process ↗";
        actions.appendChild(link);
      }

      actions.appendChild(next);

      detailsElement.append(
        heading,
        description,
        metadata,
        actions
      );

      if (!process.notionUrl) {
        const hint = document.createElement("p");
        hint.className = "hint";
        hint.textContent =
          "Notion page link has not been configured yet.";
        detailsElement.appendChild(hint);
      }
    }

    renderFlow();
    renderDetails();
  </script>
</body>
</html>
